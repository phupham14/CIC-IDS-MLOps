services:
  mlflow:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    image: cic-ids-app:latest
    container_name: cic-ids-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
    volumes:
      - ./mlflow_server:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: cic-ids-app:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: cic-ids-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODELS_CONFIG=models.yaml
      - PREDICTION_LOG_DIR=logs/predictions
      - MODEL_RELOAD_INTERVAL_SEC=60
      - LOG_FLUSH_MAX_ROWS=1000
      - LOG_FLUSH_INTERVAL_SEC=60
    volumes:
      - ./logs:/app/logs
      - ./data/preprocessing:/app/data/preprocessing:ro
      - ./models.yaml:/app/models.yaml:ro
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: cic-ids-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cic-ids-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cic-ids-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
