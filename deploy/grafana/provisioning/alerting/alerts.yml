apiVersion: 1

groups:
  - orgId: 1
    name: cic_ids_alerts
    folder: CIC-IDS Alerts
    interval: 30s
    rules:
      - uid: ids_retrain_trigger_red
        title: "[RED] Retrain Trigger Activated"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(ids_retrain_trigger)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
        for: 0s
        annotations:
          summary: "Điều kiện retrain đang kích hoạt (ids_retrain_trigger == 1)"
          description: "Hiệu năng mô hình giảm dưới ngưỡng trên nhãn thực tế. Cần chạy pipeline tái huấn luyện."
        labels:
          severity: critical

      - uid: ids_drift_or_alert_rate_yellow
        title: "[YELLOW] Data Drift or High Alert Rate Warning"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(ids_dataset_drift) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
        for: 0s
        annotations:
          summary: "Cảnh báo vàng: Phát hiện Data Drift (ids_dataset_drift == 1)"
          description: "Chỉ cảnh báo theo dõi, không tự động kích hoạt retrain (xem Kịch bản 2)."
        labels:
          severity: warning
